[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Redirections 301 depuis l'ancien site WordPress (préservation du SEO)
[[redirects]]
  from = "/contact"
  to = "/#contact"
  status = 301
[[redirects]]
  from = "/ressources"
  to = "/services"
  status = 301
[[redirects]]
  from = "/faq"
  to = "/services"
  status = 301
[[redirects]]
  from = "/category/*"
  to = "/blog"
  status = 301

# En-têtes de sécurité
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
